  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AmberFlux Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syncopate:wght@400;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
      
      body {
        background-color: var(--component-app-shell-bg, #c9c0b3);
        color: var(--color-text-primary, #332d27);
        font-family: 'Noto Sans SC', 'Space Mono', monospace;
        overflow: hidden;
      }
      
      /* Custom Scrollbar */
      
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      
      ::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.02);
      }
      
      ::-webkit-scrollbar-thumb {
        background: var(--color-border-strong);
        border-radius: 3px;
      }
      
      ::-webkit-scrollbar-thumb:hover {
        background: var(--color-amber-400);
      }
      
      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
      }
      
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: var(--color-border-default);
      }
      
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: var(--color-amber-400);
      }
      
      /* Dropdown Animation */
      
      @keyframes dropdown-in {
        from {
          opacity: 0;
          transform: translateY(-8px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      
      .animate-dropdown {
        animation: dropdown-in 0.2s ease-out forwards;
      }
      
      /* Flow Chart Animations */
      
      @keyframes flow-dash {
        to {
          stroke-dashoffset: -20;
        }
      }
      
      .animate-flow-line {
        stroke-dasharray: 5 5;
        animation: flow-dash 1s linear infinite;
      }
      
      .glass-panel {
        background: var(--component-panel-bg);
        border: 1px solid var(--component-panel-border);
        box-shadow: var(--shadow-xs);
      }
      
      /* Tech noise texture */
      
      .bg-noise {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        opacity: 0.015;
        z-index: 0;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }
      
      /* View transitions */
      
      .view-enter {
        animation: view-fade-in 0.4s cubic-bezier(0.2, 0, 0.2, 1) forwards;
      }
      
      @keyframes view-fade-in {
        from {
          opacity: 0;
          transform: translateY(10px) scale(0.99);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      
      /* Static tech border - refined */
      
      .tech-border {
        position: relative;
      }
      
      .tech-border::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        padding: 1px;
        background: var(--color-border-soft);
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
        z-index: 10;
      }
    </style>
